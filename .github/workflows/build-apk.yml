name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  build:
    env:
      LAB_KEYSTORE_PASS: ${{ secrets.LAB_KEYSTORE_PASS }}
      LAB_KEY_ALIAS: ${{ secrets.LAB_KEY_ALIAS }}
      LAB_KEY_PASS: ${{ secrets.LAB_KEY_PASS }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # Optional installer: upload dikoveriya-lab-complete.zip to the repository root.
      # The workflow expands it and attempts to commit all complete files.
      - name: Install source package if present
        run: |
          if [ -f dikoveriya-lab-complete.zip ]; then
            unzip -oq dikoveriya-lab-complete.zip -d .
            rm -f dikoveriya-lab-complete.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Install complete Dikoveriya LAB project'
              git push origin HEAD:main || echo 'Cannot commit from Actions. The sources were still extracted for this build.'
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key if configured
        env:
          LAB_KEYSTORE_B64: ${{ secrets.LAB_KEYSTORE_B64 }}
        run: |
          if [ -n "$LAB_KEYSTORE_B64" ]; then
            mkdir -p app/signing
            printf '%s' "$LAB_KEYSTORE_B64" | base64 -d > app/signing/dikoveriya.jks
          else
            echo 'WARNING: temporary debug signing; upgrades may require uninstalling the old APK.'
          fi

      - name: Test core calculations and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dikoveriya-lab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
