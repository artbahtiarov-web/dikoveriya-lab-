name: Validate Android changes (PR)

# Never expose the release signing key to pull request code.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout candidate changes
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source and schema validation
        run: |
          set -euo pipefail
          test -f qa/check_v050.py || { echo "::error::Missing baseline validator"; exit 1; }
          python3 qa/check_v050.py
          python3 -m unittest discover -s qa -p 'test_*.py' -v

      - name: Run unit tests and build debug APK with Android's temporary test certificate
        env:
          LAB_PR_DEBUG_BUILD: 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload PR debug APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dikoveriya-pr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
