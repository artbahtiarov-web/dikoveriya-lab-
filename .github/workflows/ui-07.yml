name: Android UI 0.7 — 360–430dp

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ui-07.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab07-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LAB_PR_DEBUG_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable /dev/kvm for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test UI at 360dp / 150% and 430dp / 160% system font scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p screenshots
            adb shell wm size 360x800
            adb shell wm density 160
            adb shell settings put system font_scale 1.5
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            adb shell am start -n ru.dikoveriya.lab/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/lab07-360-large.png
            adb pull /sdcard/lab07-360-large.png screenshots/lab07-360-large.png
            adb shell am force-stop ru.dikoveriya.lab
            adb shell wm size 430x900
            adb shell wm density 160
            adb shell settings put system font_scale 1.6
            gradle --no-daemon :app:connectedDebugAndroidTest --rerun-tasks --stacktrace
            adb shell am start -n ru.dikoveriya.lab/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/lab07-430-large.png
            adb pull /sdcard/lab07-430-large.png screenshots/lab07-430-large.png

      - name: Upload emulator screenshots and instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab07-ui-360-430
          path: |
            screenshots/*.png
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
