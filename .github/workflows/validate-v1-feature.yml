name: Validate Dikoveriya LAB 1.0 feature branches

# Validate feature work based on the 0.9 release candidate without
# putting unfinished NIIMBOT print code into the main release branch.
# No signing secrets are used; these are temporary debug test builds.
on:
  push:
    branches:
      - 'feat/v1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LAB_PR_DEBUG_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate schema and source
        run: |
          set -euo pipefail
          python3 qa/check_v050.py
          python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Compile, test and build debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lab-v1-debug-do-not-install-over-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      LAB_PR_DEBUG_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instrumented Android tests 360/430dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            adb shell wm size 360x800
            adb shell wm density 160
            adb shell settings put system font_scale 1.5
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            adb shell am start -n ru.dikoveriya.lab/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/v1-360.png
            adb pull /sdcard/v1-360.png screenshots/v1-360.png
            adb shell am force-stop ru.dikoveriya.lab
            adb shell wm size 430x900
            adb shell wm density 160
            adb shell settings put system font_scale 1.6
            gradle --no-daemon :app:connectedDebugAndroidTest --rerun-tasks --stacktrace
            adb shell am start -n ru.dikoveriya.lab/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/v1-430.png
            adb pull /sdcard/v1-430.png screenshots/v1-430.png
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-v1-ui-360-430
          path: |
            screenshots/*.png
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
